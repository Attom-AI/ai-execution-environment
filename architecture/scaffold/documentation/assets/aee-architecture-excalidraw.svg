<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">AI Execution Environment work-item architecture</title>
  <desc id="description">An issue enters the AEE control plane. A work item combines a fetch-only canonical repository, durable workspace, host-local identity, disposable worktree, and exclusive container assigned from a configurable bounded runtime pool.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #172033; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #5c667a; }
      .label { font-size: 16px; font-weight: 650; }
      .detail { font-size: 13px; fill: #5c667a; }
      .small { font-size: 12px; fill: #5c667a; }
      .edge { fill: none; stroke: #687386; stroke-width: 2; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .edge-green { fill: none; stroke: #16845b; stroke-width: 2.2; marker-end: url(#arrow-green); }
      .edge-purple { fill: none; stroke: #7c3aed; stroke-width: 2.2; marker-end: url(#arrow-purple); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#687386"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#16845b"/></marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7c3aed"/></marker>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="56" y="52" class="title">One work item, clearly bounded</text>
  <text x="56" y="78" class="subtitle">AEE isolates execution while durable state survives container and worktree disposal.</text>

  <rect x="56" y="105" width="230" height="72" rx="10" fill="#ffffff" stroke="#cbd3df" stroke-width="1.5"/>
  <text x="76" y="134" class="label">Issue or operator</text>
  <text x="76" y="157" class="detail">requests a unit of work</text>
  <path d="M286 141 H356" class="edge-blue"/>
  <text x="304" y="128" class="small">intake</text>

  <rect x="356" y="105" width="330" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="378" y="134" class="label mono">bin/aee control plane</text>
  <text x="378" y="157" class="detail">scaffold · assign · start · stop · close</text>
  <path d="M521 177 V218" class="edge-blue"/>
  <text x="535" y="204" class="small">creates one work-item boundary</text>

  <rect x="42" y="220" width="1116" height="404" rx="16" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/>
  <text x="66" y="254" class="label">Work-item boundary</text>
  <text x="310" y="254" class="detail">one branch · one identity · one durable record · one runtime assignment</text>

  <text x="70" y="294" class="small">PERSISTENT INPUTS</text>
  <rect x="70" y="310" width="260" height="76" rx="9" fill="#ecfdf5" stroke="#16845b" stroke-width="1.6"/>
  <text x="90" y="340" class="label">Canonical repository</text>
  <text x="90" y="364" class="detail">fetch-only source</text>

  <rect x="70" y="410" width="260" height="76" rx="9" fill="#ecfdf5" stroke="#16845b" stroke-width="1.6"/>
  <text x="90" y="440" class="label">Work-item workspace</text>
  <text x="90" y="464" class="detail">durable state and artifacts</text>

  <rect x="70" y="510" width="260" height="76" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="90" y="540" class="label">Identity profile</text>
  <text x="90" y="564" class="detail">host-local credentials</text>

  <text x="426" y="294" class="small">DISPOSABLE EXECUTION</text>
  <rect x="426" y="330" width="250" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="448" y="364" class="label">Disposable worktree</text>
  <text x="448" y="389" class="detail">branch from <tspan class="mono">origin/&lt;default&gt;</tspan></text>

  <rect x="426" y="486" width="250" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="448" y="520" class="label">Exclusive container</text>
  <text x="448" y="545" class="detail">toolchain and active session</text>
  <path d="M551 422 V486" class="edge-blue"/>
  <text x="566" y="458" class="small">mounted as workspace</text>

  <path d="M330 348 H426" class="edge-green"/>
  <text x="354" y="335" class="small">creates</text>
  <path d="M426 448 H330" class="edge-green"/>
  <text x="345" y="435" class="small">persists handoffs</text>
  <path d="M330 548 H426" class="edge-purple"/>
  <text x="346" y="535" class="small">read-only mount</text>

  <rect x="770" y="300" width="344" height="278" rx="12" fill="#f8fafc" stroke="#7b8798" stroke-width="1.5"/>
  <text x="794" y="334" class="label">Bounded runtime pool</text>
  <text x="794" y="357" class="detail">configurable capacity · claimed lazily</text>

  <rect x="794" y="386" width="296" height="72" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="814" y="415" class="label">Active assignment</text>
  <text x="814" y="439" class="detail">this container + worktree</text>

  <rect x="794" y="482" width="296" height="62" rx="9" fill="#ffffff" stroke="#9aa5b5" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="814" y="510" class="label">Available capacity</text>
  <text x="814" y="532" class="detail">unclaimed until another work item starts</text>

  <path d="M676 532 H744 Q758 532 758 518 V422 Q758 408 772 408 H794" class="edge-blue"/>
  <text x="700" y="516" class="small">claims slot</text>

  <line x1="56" y1="654" x2="1144" y2="654" stroke="#d8dee8"/>
  <text x="64" y="687" class="label mono">stop</text>
  <text x="112" y="687" class="detail">pauses the container and retains its assignment</text>
  <text x="606" y="687" class="label mono">close</text>
  <text x="670" y="687" class="detail">removes container + worktree; durable workspace survives</text>
</svg>
