<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title description">
  <title id="title">Issue-driven agent pipeline</title>
  <desc id="description">A work item moves through preparation, a bounded implementation testing and review loop, publication, and closure. Every stage communicates through durable files rather than conversation memory.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #172033; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #5c667a; }
      .phase { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #5c667a; }
      .stage { font-size: 15px; font-weight: 650; }
      .detail { font-size: 12px; fill: #5c667a; }
      .edge { fill: none; stroke: #687386; stroke-width: 2; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arrow-blue); }
      .edge-return { fill: none; stroke: #b45309; stroke-width: 2; marker-end: url(#arrow-amber); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#687386"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b45309"/></marker>
  </defs>

  <rect width="1200" height="590" fill="#f8fafc"/>
  <text x="54" y="50" class="title">Issue-driven agent pipeline</text>
  <text x="54" y="76" class="subtitle">The coordinator advances one bounded stage at a time from durable state.</text>

  <!-- Prepare -->
  <text x="54" y="122" class="phase">PREPARE</text>
  <rect x="54" y="140" width="218" height="78" rx="10" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/>
  <text x="74" y="170" class="stage">1 · Scaffold</text>
  <text x="74" y="194" class="detail">issue → workspace + runtime</text>

  <path d="M272 179 H306" class="edge"/>

  <rect x="306" y="140" width="218" height="78" rx="10" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/>
  <text x="326" y="170" class="stage">2 · Refine</text>
  <text x="326" y="194" class="detail">scope + acceptance criteria</text>

  <path d="M524 179 H558" class="edge"/>

  <rect x="558" y="140" width="218" height="78" rx="10" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/>
  <text x="578" y="170" class="stage">3 · Design</text>
  <text x="578" y="194" class="detail">smallest viable approach</text>

  <path d="M776 179 H826 Q842 179 842 195 V265" class="edge-blue"/>

  <!-- Build and verify loop -->
  <rect x="54" y="250" width="922" height="196" rx="14" fill="#fffdf7" stroke="#d29a39" stroke-width="1.5"/>
  <text x="76" y="281" class="phase">BUILD + VERIFY · BOUNDED FEEDBACK LOOP</text>

  <rect x="78" y="305" width="246" height="82" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
  <text x="98" y="336" class="stage">4 · Implement</text>
  <text x="98" y="361" class="detail">committed changes in worktree</text>

  <path d="M324 346 H380" class="edge-blue"/>

  <rect x="380" y="305" width="246" height="82" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
  <text x="400" y="336" class="stage">5 · Test</text>
  <text x="400" y="361" class="detail">verification evidence</text>

  <path d="M626 346 H682" class="edge-blue"/>

  <rect x="682" y="305" width="246" height="82" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.7"/>
  <text x="702" y="336" class="stage">6 · Review</text>
  <text x="702" y="361" class="detail">acceptance + maintainability</text>

  <path d="M503 387 V411 H201 V387" class="edge-return"/>
  <text x="295" y="429" class="detail">failed tests return to implementation</text>

  <path d="M805 387 V436 H201 V387" class="edge-return"/>
  <text x="614" y="429" class="detail">changes requested</text>

  <rect x="994" y="270" width="152" height="132" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
  <text x="1014" y="301" class="stage">Loop guard</text>
  <text x="1014" y="327" class="detail">attempts are capped</text>
  <text x="1014" y="350" class="detail">per work item</text>
  <line x1="1014" y1="368" x2="1126" y2="368" stroke="#ead6b2"/>
  <text x="1014" y="390" class="detail">limit → human review</text>

  <!-- Publish -->
  <path d="M805 387 V466 H177 V500" class="edge-blue"/>
  <text x="682" y="458" class="detail">approved</text>
  <text x="54" y="486" class="phase">PUBLISH + CLOSE</text>

  <rect x="54" y="500" width="246" height="62" rx="10" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/>
  <text x="74" y="528" class="stage">7 · Create PR</text>
  <text x="74" y="548" class="detail">push under assigned identity</text>

  <path d="M300 531 H356" class="edge"/>

  <rect x="356" y="500" width="246" height="62" rx="10" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/>
  <text x="376" y="528" class="stage">8 · Maintain PR</text>
  <text x="376" y="548" class="detail">checks + actionable feedback</text>

  <path d="M602 531 H658" class="edge"/>

  <rect x="658" y="500" width="246" height="62" rx="10" fill="#ffffff" stroke="#aab4c3" stroke-width="1.5"/>
  <text x="678" y="528" class="stage">9 · Close</text>
  <text x="678" y="548" class="detail">record outcome + release runtime</text>

  <!-- Durable handoff foundation -->
  <rect x="928" y="474" width="218" height="88" rx="10" fill="#ecfdf5" stroke="#16845b" stroke-width="1.5"/>
  <text x="948" y="502" class="stage">Durable handoff</text>
  <text x="948" y="526" class="detail mono">meta.json · session-state.md</text>
  <text x="948" y="548" class="detail mono">history.log · artifacts/</text>

</svg>
