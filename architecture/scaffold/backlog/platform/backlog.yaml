- id: claude-code-interface
  status: in-progress
  progress:
    - Phase 1 (interactive parity) completed in 01be556.
    - Phase 2 (stage subagents) completed; Phase 3 and remaining platform wiring are open.
  summary: Add native Claude Code support as a first-class interface alongside Codex and Antigravity, using thin adapters over the tool-neutral workflow definitions.
  decisions:
    - Choose the skill source of truth (recommended: .agents/skills/ canonical, synced into .codex/ and .claude/).
    - Choose the in-container Claude credential model (subscription login under .local/state/claude or an API key from host-local secret storage).
  steps:
    # Phase 1: interactive parity (done)
    - Add root CLAUDE.md that imports AGENTS.md and points to the work-item and onboarding skills.
    - Add .claude/skills/work-item-execution/SKILL.md and .claude/skills/repository-onboarding/SKILL.md identical to .agents/skills/.
    - Add tracked .claude/settings.json denying reads of .env, .env.* and .local/state/**, denying edits under repos/**, and allowing platform scripts.
    - Add a PreToolUse hook that requires approval for git push, git clone, and pull-request creation.
    - Ignore .claude/settings.local.json and CLAUDE.local.md in .gitignore.
    - Name ~/.claude/CLAUDE.md as the operator-wide rules location in AGENTS.md.
    # Phase 2: stage subagents (done)
    - Generate .claude/agents/<stage>.md wrappers from platform/workflows/agents/ with a generator script; wrappers reference the stage file and never duplicate it.
    - Restrict non-code stages (issue-refinement, solution-designer, code-reviewer) to editing work-item records only, through a subagent-scoped write hook; they still need Edit and Write for artifacts and state.
    - Fail validation when generated wrappers are stale.
    # Phase 3: runtime and credentials
    - Add the pinned Claude Code devcontainer feature and update devcontainer-lock.json.
    - Mount .local/state/claude into the runtime and set CLAUDE_CONFIG_DIR; never forward host ANTHROPIC_API_KEY implicitly.
    - Make setup name the Claude account it will use and require operator confirmation.
    - Implement a claude adapter for headless stage execution (claude -p per stage via devcontainer exec), coordinated with orchestration-engine.
    # Platform wiring
    - Detect claude in setup.sh plan and explain its credential location when --interface claude is selected.
    - Report claude in doctor.sh as optional, not required.
    - Extend validate.sh with .claude and CLAUDE.md required and portable paths, settings.json parsing, and SKILL.md parity across .agents, .codex and .claude.
    - Add .claude and CLAUDE.md to architecture/sync-scaffold.sh.
    - Update architecture/pipeline-and-agents.md, setup-guide.md, install-and-portability.md and README.md.
    - Add an --interface claude case to platform/tests/setup-profiles.sh.
  related:
    - orchestration-engine
